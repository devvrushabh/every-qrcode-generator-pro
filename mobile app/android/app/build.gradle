plugins {
    id 'com.android.application'
}

android {
    namespace "com.everyqrcodegenerator.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.everyqrcodegenerator.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Ensures generated APK/AAB has a readable filename
        setProperty("archivesBaseName", "EveryQRCodeGeneratorPro-v${versionName}")
    }

    signingConfigs {
        release {
            // For CI/CD or local signing — point to your keystore.
            // Store passwords in gradle.properties or environment variables, NEVER in source.
            storeFile file('release.keystore')
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: project.findProperty("RELEASE_STORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: project.findProperty("RELEASE_KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: project.findProperty("RELEASE_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig (System.getenv("KEYSTORE_PASSWORD") ? signingConfigs.release : signingConfigs.debug)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.0'

    // Material Design
    implementation 'com.google.android.material:material:1.12.0'

    // Layouts
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // WebView
    implementation 'androidx.webkit:webkit:1.11.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.2'

    // Splash Screen API (Android 12+)
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
